<script>
/* ============================================================
   EDIT HERE - typing greeting in the hero ("Hello, my name is")
   t = the text, l = language code, c:1 = Chinese/Japanese/Korean.
   Add, delete or reorder lines. Keep the comma at the end of every
   line except the last one.
   ============================================================ */

  { t: "Halo, nama saya", l: "id" },
  { t: "你好，我的名字是", l: "zh", c: 1 },
  { t: "Hello, my name is", l: "en" },
  { t: "Hallo, mijn naam is", l: "nl" },
  { t: "Bonjour, je m'appelle", l: "fr" },
  { t: "Hola, me llamo", l: "es" },
  { t: "こんにちは、私の名前は", l: "ja", c: 1 },
  { t: "Hallo, ich heiße", l: "de" },
  { t: "안녕하세요, 제 이름은", l: "ko", c: 1 }
];
/* speeds in milliseconds (smaller = faster) */
window.TYPE_SPEED = 90;   /* typing each letter */
window.ERASE_SPEED = 38;  /* erasing each letter */
window.HOLD_TIME = 1700;  /* how long a finished greeting stays */
/* ============================================================ */

/* ------------------------------------------------------------------
   Fonts
   Citadel Script is a licensed font. If you own it, drop the file at
   src/assets/fonts/CitadelScript.woff2 and uncomment the block below.
   Until then the stack falls back to Pinyon Script (see tailwind.config.js).

@font-face {
  font-family: 'Citadel Script';
  src: local('Citadel Script'), local('CitadelScript'), local('Citadel-Script');
  font-display: swap;
}

/* ------------------------------------------------------------------
   Palette tokens (space-separated RGB so Tailwind opacity works)
   #FDEBF9 #EDA2B7 #D18EB1 #CC256D #5D946A #013B22
------------------------------------------------------------------- */
:root {
  --bg: 253 235 249; /* #FDEBF9 */
  --ink: 1 59 34; /* #013B22 */
  --accent: 204 37 109; /* #CC256D */
  --hot: 204 37 109;
  --soft: 237 162 183; /* #EDA2B7 */
  --mauve: 209 142 177; /* #D18EB1 */
  --leaf: 93 148 106; /* #5D946A */
  --surface: 237 162 183;
  --on-surface: 1 59 34;
  --grain: 0.07;
}
.dark {
  --bg: 22 22 22; /* poster black */
  --ink: 253 235 249;
  --accent: 237 162 183;
  --hot: 204 37 109;
  --soft: 237 162 183;
  --mauve: 209 142 177;
  --leaf: 93 148 106;
  --surface: 1 59 34;
  --on-surface: 253 235 249;
  --grain: 0.09;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  @apply bg-bg text-ink font-sans antialiased;
  transition: background-color 0.5s ease, color 0.5s ease;
  overflow-x: hidden;
}
::selection {
  background: rgb(var(--hot));
  color: #fdebf9;
}
:focus-visible {
  outline: 2px solid rgb(var(--accent));
  outline-offset: 3px;
}

/* paper grain over everything, keeps flat colour from feeling digital */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  opacity: var(--grain);
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ------------------------------------------------------------------
   Small typographic helpers
------------------------------------------------------------------- */
.label {
  @apply text-[11px] uppercase tracking-[0.22em] font-medium;
}
/* the ring-with-dot bullet from the poster language */
.mark::before {
  content: '';
  display: inline-block;
  width: 0.72em;
  height: 0.72em;
  margin-right: 0.7em;
  border-radius: 999px;
  border: 1.5px solid rgb(var(--hot));
  background: radial-gradient(circle, rgb(var(--hot)) 34%, transparent 38%);
  transform: translateY(0.06em);
}
.link-u {
  background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
  transition: background-size 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.link-u:hover,
.link-u:focus-visible {
  background-size: 100% 1px;
}
.cjk-v {
  writing-mode: vertical-rl;
  text-orientation: upright;
}

/* water-fill button */
.btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 0.8em;
  padding: 0.95rem 1.5rem;
  border: 1px solid rgb(var(--ink) / 0.9);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 600;
  transition: color 0.4s ease, border-color 0.4s ease;
}
.btn::before {
  content: '';
  position: absolute;
  inset: -1px;
  z-index: -1;
  background: rgb(var(--accent));
  transform: translateY(101%);
  border-radius: 50% 50% 0 0 / 14% 14% 0 0;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.5s ease;
}
.btn:hover,
.btn:focus-visible {
  color: rgb(var(--bg));
  border-color: rgb(var(--accent));
}
.btn:hover::before,
.btn:focus-visible::before {
  transform: translateY(0);
  border-radius: 0;
}
.btn-solid {
  background: rgb(var(--accent));
  border-color: rgb(var(--accent));
  color: rgb(var(--bg));
}
.btn-solid::before {
  background: rgb(var(--ink));
}
.btn-solid:hover,
.btn-solid:focus-visible {
  border-color: rgb(var(--ink));
  color: rgb(var(--bg));
}

/* ------------------------------------------------------------------
   Motion
------------------------------------------------------------------- */
.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
    transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.reveal.in {
  opacity: 1;
  transform: none;
}

/* petals open from the base, one layer after another */
.petal {
  transform-origin: 0 0;
  animation: bloom 1.4s cubic-bezier(0.2, 0.85, 0.2, 1) both;
}
@keyframes bloom {
  from {
    transform: scale(0.04) rotate(-10deg);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  to {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}
.sway {
  transform-origin: 200px 460px;
  animation: sway 9s ease-in-out infinite;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-1.4deg);
  }
  50% {
    transform: rotate(1.6deg);
  }
}
.ripple {
  transform-box: fill-box;
  transform-origin: center;
  animation: ripple 6s cubic-bezier(0.2, 0.5, 0.4, 1) infinite;
  opacity: 0;
}
@keyframes ripple {
  0% {
    transform: scale(0.2);
    opacity: 0;
  }
  12% {
    opacity: 0.85;
  }
  100% {
    transform: scale(1.5);
    opacity: 0;
  }
}
.sparkle {
  transform-box: fill-box;
  transform-origin: center;
  animation: twinkle 3.4s ease-in-out infinite;
}
@keyframes twinkle {
  0%,
  100% {
    transform: scale(0.4) rotate(0);
    opacity: 0.25;
  }
  50% {
    transform: scale(1.1) rotate(45deg);
    opacity: 1;
  }
}
.drift {
  animation: drift 11s ease-in-out infinite;
}
@keyframes drift {
  0%,
  100% {
    transform: translate(0, 0) rotate(-12deg);
  }
  50% {
    transform: translate(10px, -6px) rotate(6deg);
  }
}
.cue {
  animation: cue 2.4s ease-in-out infinite;
  transform-origin: top;
}
@keyframes cue {
  0% {
    transform: scaleY(0);
  }
  50% {
    transform: scaleY(1);
  }
  100% {
    transform: scaleY(1);
    opacity: 0;
  }
}
.rise {
  animation: rise 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(26px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.hero-name {
  font-size: clamp(6.2rem, 33vw, 12rem);
}
@media (min-width: 1024px) {
  .hero-name {
    font-size: clamp(9rem, 17vw, 17rem);
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .reveal {
    opacity: 1;
    transform: none;
  }
  .ripple {
    opacity: 0.4;
  }
}

/* ------------------------------------------------------------------
   Organisation cards: front and back share one grid cell, so the card
   is as tall as the taller face. Hover, keyboard focus or tap flips it.
------------------------------------------------------------------- */
.org {
  position: relative;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  height: 25rem;
  cursor: pointer;
  border: 1px solid rgb(var(--ink) / 0.18);
  background: rgb(var(--bg));
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease,
    border-color 0.4s ease;
}
.org-front,
.org-back {
  grid-area: 1 / 1;
  transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
    visibility 0.45s;
}
.org-front {
  overflow: hidden;
}
.org-back {
  overflow-y: auto;
  scrollbar-width: thin;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px);
}
.org.open .org-front {
  opacity: 0;
  transform: translateY(-10px);
}
.org.open .org-back {
  opacity: 1;
  visibility: visible;
  transform: none;
}
.org:focus-visible {
  outline-offset: 4px;
}
@media (hover: hover) {
  .org:hover {
    transform: translateY(-4px);
    border-color: rgb(var(--accent));
    box-shadow: 0 18px 40px -22px rgb(var(--accent) / 0.55);
  }
  .org:hover .org-front {
    opacity: 0;
    transform: translateY(-10px);
  }
  .org:hover .org-back {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
}

/* Name is written in left to right. Same font, same layout: only a clip
   that opens, so the surname appears as the stroke reaches it. */
.write {
  animation: write 2.8s cubic-bezier(0.65, 0, 0.35, 1) 0.4s both;
}
@keyframes write {
  from {
    clip-path: inset(-25% 100% -80% -6%);
  }
  to {
    clip-path: inset(-25% -12% -80% -6%);
  }
}


/* ------------------------------------------------------------------
   Vertical Chinese name beside the hero name: faint, each character
   drifts in one after another, then floats gently.
------------------------------------------------------------------- */
.cn-v {
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: 0.12em;
  line-height: 1;
  font-size: clamp(2.4rem, 9vw, 4.5rem);
  pointer-events: none;
  user-select: none;
}
@media (min-width: 1024px) {
  .cn-v {
    font-size: clamp(3rem, 5.2vw, 5.5rem);
  }
}
.cn-c {
  display: inline-block;
  opacity: 0;
  animation: cnIn 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, cnFloat 7s ease-in-out infinite;
  animation-delay: calc(1.6s + var(--i) * 0.4s), calc(3.4s + var(--i) * 0.5s);
}
@keyframes cnIn {
  from {
    opacity: 0;
    transform: translateY(-22px) scale(0.9);
    filter: blur(8px);
  }
  to {
    opacity: 0.2;
    transform: none;
    filter: blur(0);
  }
}
@keyframes cnFloat {
  0%,
  100% {
    translate: 0 0;
  }
  50% {
    translate: 0 10px;
  }
}

/* Organisation logos: recoloured to the palette pink, light background removed.
   Front face = pink on the card; back face (inverted colours) = the opposite pink. */
.logo-pink { filter: url(#logoHot); }
.dark .logo-pink { filter: url(#logoSoft); }
.logo-pink-back { filter: url(#logoSoft); }
.dark .logo-pink-back { filter: url(#logoHot); }

/* Typing greeting in the hero */
.type-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 3px;
  vertical-align: -0.15em;
  background: currentColor;
  animation: caretBlink 1s steps(1) infinite;
}
@keyframes caretBlink {
  50% {
    opacity: 0;
  }
}

/* Hanging lotus vine on the work timeline (grows as you scroll) */
.vine-sway {
  transform-box: fill-box;
  transform-origin: 50% 0;
  animation: vineSway 5s ease-in-out infinite alternate;
}
@keyframes vineSway {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}
@media (prefers-reduced-motion: reduce) {
  .vine-sway { animation: none; }
}
