/* ------------------------------------------------------------------

/* ------------------------------------------------------------------
   Motion
------------------------------------------------------------------- */
.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
    transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.reveal.in {
  opacity: 1;
  transform: none;
}

/* petals open from the base, one layer after another */
.petal {
  transform-origin: 0 0;
  animation: bloom 1.4s cubic-bezier(0.2, 0.85, 0.2, 1) both;
}
@keyframes bloom {
  from {
    transform: scale(0.04) rotate(-10deg);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  to {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}
.sway {
  transform-origin: 200px 460px;
  animation: sway 9s ease-in-out infinite;
}
@keyframes sway {
  0%,
  100% {
    transform: rotate(-1.4deg);
  }
  50% {
    transform: rotate(1.6deg);
  }
}
.ripple {
  transform-box: fill-box;
  transform-origin: center;
  animation: ripple 6s cubic-bezier(0.2, 0.5, 0.4, 1) infinite;
  opacity: 0;
}
@keyframes ripple {
  0% {
    transform: scale(0.2);
    opacity: 0;
  }
  12% {
    opacity: 0.85;
  }
  100% {
    transform: scale(1.5);
    opacity: 0;
  }
}
.sparkle {
  transform-box: fill-box;
  transform-origin: center;
  animation: twinkle 3.4s ease-in-out infinite;
}
@keyframes twinkle {
  0%,
  100% {
    transform: scale(0.4) rotate(0);
    opacity: 0.25;
  }
  50% {
    transform: scale(1.1) rotate(45deg);
    opacity: 1;
  }
}
.drift {
  animation: drift 11s ease-in-out infinite;
}
@keyframes drift {
  0%,
  100% {
    transform: translate(0, 0) rotate(-12deg);
  }
  50% {
    transform: translate(10px, -6px) rotate(6deg);
  }
}
.cue {
  animation: cue 2.4s ease-in-out infinite;
  transform-origin: top;
}
@keyframes cue {
  0% {
    transform: scaleY(0);
  }
  50% {
    transform: scaleY(1);
  }
  100% {
    transform: scaleY(1);
    opacity: 0;
  }
}
.rise {

/* ------------------------------------------------------------------
   Organisation cards: front and back share one grid cell, so the card
   is as tall as the taller face. Hover, keyboard focus or tap flips it.
------------------------------------------------------------------- */
.org {
  position: relative;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  height: 25rem;
  cursor: pointer;
  border: 1px solid rgb(var(--ink) / 0.18);
  background: rgb(var(--bg));
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease,
    border-color 0.4s ease;
}
.org-front,
.org-back {
  grid-area: 1 / 1;
  transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
    visibility 0.45s;
}
.org-front {
  overflow: hidden;
}
.org-back {
  overflow-y: auto;
  scrollbar-width: thin;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px);
}
.org.open .org-front {
  opacity: 0;
  transform: translateY(-10px);
}
.org.open .org-back {
  opacity: 1;
  visibility: visible;
  transform: none;
}
.org:focus-visible {
  outline-offset: 4px;
}
@media (hover: hover) {
  .org:hover {
    transform: translateY(-4px);
    border-color: rgb(var(--accent));
    box-shadow: 0 18px 40px -22px rgb(var(--accent) / 0.55);

  .org:hover .org-front {
    opacity: 0;
    transform: translateY(-10px);

    opacity: 1;
    visibility: visible;
    transform: none;
  }
}

.sf-x:hover, .sf-nav:hover { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: rgb(var(--bg)); }
.sf-stage { position:relative; height:min(52vh,440px); overflow:hidden; display:grid; place-items:center; background: rgb(var(--ink) / .06); }
.sf-img { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:contain; transition: opacity .25s; }
.sf-msg { position:absolute; margin:0; font-size:14px; opacity:.6; }
.sf-nav { z-index:2; position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border:1px solid rgb(var(--ink) / .25); border-radius:50%; background: rgb(var(--bg) / .85); color: rgb(var(--ink)); font-size:22px; line-height:1; cursor:pointer; transition: background .2s, color .2s, border-color .2s; }
.sf-prev { left:.7rem; } .sf-next { right:.7rem; }
.sf-cap { margin:0; padding:.85rem 1.1rem .2rem; text-align:center; font-size:15px; }
.sf-strip { display:flex; gap:.4rem; overflow-x:auto; padding:.6rem 1.1rem 1rem; scrollbar-width: thin; }
.sf-th { flex:none; width:46px; height:46px; padding:0; border:2px solid transparent; background:none; opacity:.55; cursor:pointer; transition: opacity .2s, border-color .2s; }
.sf-th:hover { opacity:.9; }
.sf-th[aria-current="true"] { border-color: rgb(var(--accent)); opacity:1; }
.sf-th img { display:block; width:100%; height:100%; object-fit:cover; }
@keyframes sfFade { from { opacity:0 } to { opacity:1 } }
@keyframes sfPop { from { opacity:0; transform: translateY(14px) scale(.98) } to { opacity:1; transform:none } }
@media (prefers-reduced-motion: reduce) { .sf-back, .sf-panel { animation:none; } .sf-papers, .sf-front, .sf-img { transition:none; } }

/* PDF preview pop-up (CV + creative portfolio) */
.pv-panel { width:min(980px,100%); height:min(92vh,920px); }
.pv-body { position:relative; flex:1; min-height:0; background: rgb(var(--ink) / .06); display:grid; place-items:center; }
.pv-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
.pv-msg { text-align:center; padding:0 1.5rem; }
.pv-link { font-size:13px; letter-spacing:.04em; padding:.45rem .85rem; border:1px solid rgb(var(--ink) / .25); border-radius:999px; color:inherit; text-decoration:none; white-space:nowrap; transition: background .2s, color .2s, border-color .2s; }
.pv-link:hover, .pv-link:focus-visible { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: rgb(var(--bg)); }
@media (max-width: 560px) { .pv-link { padding:.4rem .65rem; font-size:12px; } .pv-dl { display:none; } .pv-panel { height:90vh; } }
